<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            width: 220px;
            padding: 16px;
            margin: 0;
            background-color: #f8fafc;
            color: #0f172a;
        }

        h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .label-text {
            font-size: 14px;
        }

        /* Simple modern checkbox styling */
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h3>Player Settings</h3>
    <div class="toggle-container">
        <span class="label-text">Enable Auto-Play</span>
        <input type="checkbox" id="autoPlayToggle">
    </div>

    <script src="popup.js"></script>
</body>

</html>
